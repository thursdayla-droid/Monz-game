<title>MONZ RUMBLE 技リスト</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 種族ごとの章を たてに並べる。上に種族へ とぶ タブ(はりつく)。1つの技 = 1行のカード */
:root {
  --bg: #f3f5ee; --panel: #ffffff; --ink: #1d2a1f; --sub: #5d6b5f; --line: #d9e0d2; --accent: #2f8f4e; --chip: #e9eee4;
  --fire: #e2572b; --water: #2f86d6; --nature: #3c9a3f; --thunder: #c99a00; --light: #c9a227; --dark: #7a4bd0; --none: #7c8580;
  --s1: #b9c4bb; --s2: #7fb58c; --s3: #e39b3a; --s4: #c8423c;
  --display: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', system-ui, sans-serif;
  --body: 'Zen Kaku Gothic New', 'Hiragino Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141a16; --panel: #1c241f; --ink: #e9efe7; --sub: #9fb0a3; --line: #2e3a32; --accent: #6fd08c; --chip: #26302a;
  --fire: #ff7a4f; --water: #5aa8f0; --nature: #6fcf6a; --thunder: #f0c53a; --light: #e8cf6a; --dark: #a986f0; --none: #a2aaa5;
  --s1: #56635a; --s2: #4f8f60; --s3: #c9822a; --s4: #e0605a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141a16; --panel: #1c241f; --ink: #e9efe7; --sub: #9fb0a3; --line: #2e3a32; --accent: #6fd08c; --chip: #26302a;
  --fire: #ff7a4f; --water: #5aa8f0; --nature: #6fcf6a; --thunder: #f0c53a; --light: #e8cf6a; --dark: #a986f0; --none: #a2aaa5;
  --s1: #56635a; --s2: #4f8f60; --s3: #c9822a; --s4: #e0605a; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; }
.intro { padding-block: 24px 8px; }
.intro h1 { font-family: var(--display); font-weight: 800; font-size: 1.6rem; margin: 0; text-wrap: balance; }
.intro p { color: var(--sub); margin: 6px 0 0; font-size: .92rem; }
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; border-bottom: 1px solid var(--line); }
nav a { font-family: var(--display); font-weight: 800; text-decoration: none; color: var(--ink); background: var(--chip); padding: 6px 14px; border-radius: 999px; white-space: nowrap; font-size: .9rem; }
nav a:focus-visible, nav a:hover { outline: 2px solid var(--accent); }
section { padding-top: 22px; scroll-margin-top: 60px; }
.sh h2 { font-family: var(--display); font-weight: 800; font-size: 1.4rem; margin: 0; letter-spacing: .04em; }
.role { margin: 2px 0 0; color: var(--sub); font-size: .9rem; display: flex; gap: 12px; flex-wrap: wrap; }
.facts { display: grid; gap: 8px; margin: 12px 0; }
.facts div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.facts dt { font-size: .75rem; color: var(--accent); font-weight: 700; letter-spacing: .06em; }
.facts dd { margin: 2px 0 0; font-size: .92rem; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mv { display: grid; grid-template-columns: 46px 1fr; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.lv { text-align: center; font-variant-numeric: tabular-nums; }
.lv b { display: block; font-family: var(--display); font-size: 1.15rem; line-height: 1.1; }
.lv b::before { content: "Lv."; font-size: .62rem; color: var(--sub); display: block; font-weight: 500; }
.lv small { display: block; font-size: .62rem; color: var(--sub); line-height: 1.2; margin-top: 2px; }
.body { min-width: 0; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.nm { font-weight: 700; font-size: 1rem; margin-right: 2px; }
.el, .ty, .st { font-size: .7rem; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--sub); white-space: nowrap; }
.el { color: #fff; }
.el.fire { background: var(--fire); } .el.water { background: var(--water); } .el.nature { background: var(--nature); } .el.thunder { background: var(--thunder); }
.el.light { background: var(--light); } .el.dark { background: var(--dark); } .el.none { background: var(--none); }
.st { border: 1px solid var(--line); background: transparent; }
.st.s1 { border-color: var(--s1); } .st.s2 { border-color: var(--s2); } .st.s3 { border-color: var(--s3); color: var(--s3); } .st.s4 { border-color: var(--s4); color: var(--s4); font-weight: 700; }
.do { margin: 4px 0 2px; font-size: .9rem; }
.do.sp::before { content: "★ "; color: var(--accent); }
.nums { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .76rem; color: var(--sub); font-variant-numeric: tabular-nums; }
.nums b { color: var(--ink); font-weight: 700; }
.legend { color: var(--sub); font-size: .8rem; margin-top: 8px; }
</style>
<div class="wrap">
  <div class="intro">
    <h1>MONZ RUMBLE 技リスト</h1>
    <p>今ゲームに入っている5体・<!--COUNT-->技。新しい5体を考える時の くらべ用。数字は Lv.1 の時の目安【仮】</p>
    <p class="legend">★ = その種族だけの とくべつな動き。強さ：弱・中・強・大技。進化1 = Lv.30 の姿・進化2 = Lv.60 の姿で 覚える。Lv.25 の4つは 育て方(パワー寄り など)で1つだけ</p>
  </div>
  <nav><!--NAV--></nav>
  <!--SECTIONS-->
</div>
